/* =========================
   RENDER MEDICATIONS
========================= */

const medList =
  document.getElementById("medList");

const search =
  document.getElementById("search");

function renderMeds(filter=""){

  medList.innerHTML = "";

  const filtered =
    medicines.filter(m =>
      m.name.toLowerCase()
      .includes(filter.toLowerCase())
    );

  filtered.forEach(med => {

    const card =
      document.createElement("div");

    card.className = "med-card";

    let strengthsHTML = "";

    med.strengths.forEach(strength => {

      strengthsHTML += `
        <div class="strength"
          onclick="selectMedicine(
            '${med.name}',
            '${strength}'
          )">
          ${strength}
        </div>
      `;
    });

    card.innerHTML = `
      <div class="med-name">
        ${med.name}
      </div>

      ${strengthsHTML}
    `;

    medList.appendChild(card);

  });

}

/* =========================
   SELECT MEDICATION
========================= */

function selectMedicine(name,dose){

  // save selected medication
  localStorage.setItem(
    "selectedMedicine",
    name
  );

  // save selected dose
  localStorage.setItem(
    "selectedDose",
    dose
  );

  // redirect back to prescription page
  window.location.href =
    "prescription.html";
}

/* =========================
   SEARCH
========================= */

search.addEventListener("input", () => {

  renderMeds(search.value);

});

/* =========================
   INITIAL LOAD
========================= */

renderMeds();
